<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roast & Chills Admin</title><style>
body{font-family:system-ui;margin:0;background:#0d1020;color:#fff}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#171b31;border:1px solid #fff1;border-radius:18px;padding:20px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#fff0a;border-radius:14px}.big{font-size:27px;font-weight:900;color:#ffd447}.login{max-width:430px;margin:70px auto}input{padding:12px;border-radius:10px;border:1px solid #fff2;background:#0d1020;color:#fff;width:100%;box-sizing:border-box;margin:7px 0 10px}button{padding:11px 14px;border:0;border-radius:10px;font-weight:850;background:#ffd447;cursor:pointer;margin:4px}.danger{background:#ff7b86}.ok{background:#83f0ad}.muted{color:#b8bdd3}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.item{border:1px solid #fff1;border-radius:14px;padding:15px;margin:10px 0}.actions button{margin-left:5px}.status{padding:10px;border-radius:10px;margin:10px 0}.green{color:#83f0ad}.red{color:#ff8f9b}@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><div id="login" class="wrap login"><div class="card"><h1>Admin Login</h1><p class="muted">Roast & Chills · LPSS</p><input id="password" type="password" placeholder="Admin password"><button id="loginBtn">Login</button><p id="loginMsg" class="red"></p></div></div><div id="app" class="wrap" style="display:none"><div class="row"><div><h1>Roast & Chills Admin</h1><p class="muted">Payment verification & ticket control</p></div><button id="logout">Logout</button></div><div class="stats"><div class="stat">Sold<div id="sold" class="big">—</div></div><div class="stat">Collected<div id="money" class="big">—</div></div><div class="stat">Remaining<div id="remaining" class="big">—</div></div><div class="stat">Pending<div id="pending" class="big">—</div></div></div>
<div class="card"><div class="row"><h2>Pending payments</h2><button id="refresh">Refresh</button></div><div id="pendingList" class="muted">Loading...</div></div>
<div class="card"><h2>Search payments / tickets</h2><input id="q" placeholder="Name, phone, reference, transaction ID or ticket code"><button id="search">Search</button><div id="results"></div></div>
<div class="card"><h2>Entrance verification</h2><input id="code" placeholder="RCH-XXXXXXXX"><button id="verify">Check ticket</button><div id="verifyResult"></div></div></div>
<script>
let token=localStorage.getItem('rch_admin_token')||'';const api=async(url,opt={})=>{opt.headers={...(opt.headers||{}),'x-admin-token':token};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('rch_admin_token');location.reload()}if(!r.ok)throw Error(d.error||'Request failed');return d};
function enter(){login.style.display='none';app.style.display='block';loadAll()}
if(token)enter();
loginBtn.onclick=async()=>{try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');token=d.token;localStorage.setItem('rch_admin_token',token);enter()}catch(e){loginMsg.textContent=e.message}};
logout.onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'})}catch{}localStorage.removeItem('rch_admin_token');location.reload()};
async function summary(){const d=await api('/api/admin/summary');sold.textContent=d.sold;money.textContent='UGX '+d.collected.toLocaleString();remaining.textContent=d.remaining;pending.textContent=d.pending}
async function pendingLoad(){const items=await api('/api/admin/search?q=');const pendingItems=items.filter(x=>x.status==='PENDING');pendingList.innerHTML=pendingItems.length?pendingItems.map(x=>`<div class="item"><b>${esc(x.name)}</b><br>Reference: <b>${esc(x.id?x.id:x.reference)}</b><br>Amount: UGX ${Number(x.amount).toLocaleString()}<br>Transaction ID: ${esc(x.transactionId||'Not submitted yet')}<br><span class="muted">Submitted: ${new Date(x.createdAt).toLocaleString()}</span><div class="actions"><button class="ok" onclick="approve('${x.reference}')">Approve & issue ticket</button><button class="danger" onclick="reject('${x.reference}')">Reject</button></div></div>`).join(''):'No pending payments.'}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function approve(ref){if(!confirm('Verify the Airtel merchant transaction before approving this payment. Approve this submission?'))return;try{const d=await api('/api/admin/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:ref})});alert('Approved. Ticket: '+d.ticket.code);loadAll()}catch(e){alert(e.message)}}
async function reject(ref){if(!confirm('Reject this payment submission?'))return;try{const d=await api('/api/admin/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:ref})});loadAll()}catch(e){alert(e.message)}}
search.onclick=async()=>{try{const items=await api('/api/admin/search?q='+encodeURIComponent(q.value));results.innerHTML=items.map(x=>`<div class="item"><b>${esc(x.name)}</b> · ${esc(x.status)}<br>Reference: ${esc(x.reference)} · Ticket: ${esc(x.code||'—')}<br>Transaction: ${esc(x.transactionId||'—')}<br>Phone: ${esc(x.phone)}<br>Amount: UGX ${Number(x.amount).toLocaleString()}</div>`).join('')||'No matches.'}catch(e){results.textContent=e.message}};
verify.onclick=async()=>{try{const d=await api('/api/admin/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code.value.trim()})});verifyResult.innerHTML=`<div class="status ${d.valid?'green':'red'}">${esc(d.message||'')}${d.ticket?`<br>${esc(d.ticket.name)} ·${esc(d.ticket.code)}`:''}</div>${d.valid?'<button class="ok" onclick="useTicket(\''+esc(d.ticket.code)+'\')">Mark USED at entrance</button>':''}`}catch(e){verifyResult.textContent=e.message}};
async function useTicket(c){if(!confirm('Mark this ticket as USED?'))return;try{await api('/api/admin/use',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c})});verifyResult.innerHTML='<div class="status green">Ticket marked USED.</div>';loadAll()}catch(e){alert(e.message)}}
async function loadAll(){try{await summary();await pendingLoad()}catch(e){console.error(e)}}refresh.onclick=loadAll;
</script></body></html>
